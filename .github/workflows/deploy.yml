name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Allows re-deploying the current main without pushing a commit.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a deploy that's already publishing — a half-applied deploy
# would leave the live site inconsistent. Queue the next run instead.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Also type-checks: the build script is `tsc -b && vite build`.
      - name: Build
        run: npm run build

      # Guards the one setting that silently breaks this deployment: the app is
      # served from https://<user>.github.io/skimly.docfinder/, so vite's `base`
      # must match. If it were reset to '/', the page would load and every asset
      # would 404, which is easy to miss until someone opens the live site.
      - name: Check asset base path
        run: |
          if ! grep -q '"/skimly.docfinder/assets/' dist/index.html; then
            echo "::error::dist/index.html does not reference /skimly.docfinder/assets/."
            echo 'Check the `base` option in vite.config.ts - it must match the repository name.'
            grep -o 'src="[^"]*"' dist/index.html || true
            exit 1
          fi

      # The OCR engine and language data are served from the site itself, so a
      # missing vendored asset breaks scanned PDFs only at runtime. Fail here
      # instead, where it's visible.
      - name: Check vendored OCR assets shipped
        run: |
          for file in \
            dist/tesseract/core/tesseract-core-simd-lstm.wasm.js \
            dist/tesseract/lang/eng.traineddata.gz \
            dist/tesseract/lang/hin.traineddata.gz \
            dist/tesseract/lang/mar.traineddata.gz
          do
            if [ ! -s "$file" ]; then
              echo "::error::Missing or empty: $file (run 'npm run vendor:tesseract')"
              exit 1
            fi
          done

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

      # deploy-pages succeeding only means the artifact was accepted. If the
      # repository's Pages source is set to "Deploy from a branch" rather than
      # "GitHub Actions", the site silently serves the repository root instead
      # — the raw index.html, which references /src/main.tsx and loads nothing.
      # That has happened on this repo, and the deploy still reported success,
      # so check what the site actually serves.
      - name: Verify the live site serves the built app
        run: |
          url="${{ steps.deployment.outputs.page_url }}"
          echo "Checking $url"
          for attempt in $(seq 1 12); do
            body=$(curl -fsSL --max-time 30 "$url" || true)
            if printf '%s' "$body" | grep -q '/skimly.docfinder/assets/'; then
              echo "OK: the live site is serving the built app."
              exit 0
            fi
            if printf '%s' "$body" | grep -q '/src/main.tsx'; then
              echo "::warning::Attempt $attempt: serving unbuilt source."
            else
              echo "Attempt $attempt: not serving the built app yet."
            fi
            sleep 15
          done
          echo "::error::$url is not serving the built app after ~3 minutes."
          echo "Check Settings > Pages > Source is 'GitHub Actions', not 'Deploy from a branch'."
          exit 1
